name: CI

# 每个 push / PR 都跑六个互相独立的检查。
#
# 【六个 job 之间没有 needs】它们查的是六件不相干的事，串起来只会让反馈变慢。
# 唯一的例外是 integration 依赖一个正常的 Postgres 服务，那由 GitHub 的
# service container 提供，不需要靠 job 顺序解决。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一个分支连续 push 时，取消上一次还没跑完的——旧的那次结果已经没有意义。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 【工具版本全部锁死，不用 @latest】
# 这些命令行工具是"生成物的一部分"：oapi-codegen 换了小版本，生成的
# generated.go 就可能变，contract job 的 git diff --exit-code 会开始报
# 一个跟契约无关的失败。锁死版本才能让那个 job 只反映"契约改了没重新生成"。
#
# 【版本号的来源，不是猜的】
#   oapi-codegen      v2.8.0   —— apps/api/internal/api/generated.go 头部的
#                                  "Code generated by ... version v2.8.0"
#   river CLI         v0.47.0  —— 和 go.mod 里 github.com/riverqueue/river 同版本
#   golang-migrate    v4.20.1  —— 本机 `go install` 时落进模块缓存的那个版本
#   spectral CLI      6.15.0   —— 本机 `make lint-spec` 时 npx 落进 _npx 缓存的那个版本，
#                                  同一个号也写在 Makefile 的 SPECTRAL 变量里（两处，
#                                  理由见 spec job 的注释）
env:
  OAPI_CODEGEN_VERSION: v2.8.0
  RIVER_CLI_VERSION: v0.47.0
  MIGRATE_VERSION: v4.20.1
  SPECTRAL_VERSION: 6.15.0
  DB_URL: postgres://postgres:postgres@127.0.0.1:5432/congorag?sslmode=disable

jobs:
  # ── 1. Go 编译 / 静态检查 / 单元测试 ──────────────────────────────
  go:
    name: Go (build / vet / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # setup-go 缓存的是模块和构建缓存，键跟着 go.sum 走。
          cache: true

      # 【go.mod / go.sum 必须和源码一致】多一个没用到的依赖、少一个
      # 实际 import 的依赖，本地都能跑（模块缓存里有），别人 clone 就未必。
      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      # 【顺序有意义】go build 放在最前面：它最快，而且 go:embed 需要
      # apps/api/web/ 目录存在。新 clone 里那个目录只靠 .gitkeep 撑着——
      # 少了它这里就会以 "pattern all:web: no matching files found" 失败，
      # 这正是我们要在 CI 里拦住的情况。
      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # 【-race 不是可选项】scheduler、SSE、worker 三处都有并发；
      # 不带 -race 的话数据竞争只在生产环境偶发，带上的代价是这一条慢几倍。
      # 需要真实 Postgres 的测试在这个 job 里自动跳过（见 integration job）。
      - name: Test
        run: go test -race ./...

  # ── 2. 契约 → 生成物，必须已经提交 ──────────────────────────────
  contract:
    name: Contract (generate / no drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install codegen tools
        run: |
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@${{ env.OAPI_CODEGEN_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 【这里直接调两个生成器，不写 `make generate`】
      # 两个命令与 Makefile 的 generate-go / generate-ts 逐字一致。
      #
      # 【为什么不用 make】Makefile 现在按平台选 PATH 分隔符（见它的 PATH_SEP），
      # 在 Linux 上已经能跑；这里仍然直接调工具，是因为这个 job 要的东西很明确、
      # 就两条命令，套一层 make 只会让失败信息隔一层（`make` 报的是 make 自己的
      # 退出状态，而生成器的报错在它上面几十行）。真要改成 `make generate`
      # 也是对的，前提是 Makefile 的 PATH_SEP 分支没被改回去。
      - name: Generate Go types from contract
        run: oapi-codegen -config oapi-codegen.yaml contracts/openapi.yaml

      - name: Generate TS types from contract
        run: pnpm --filter @congorag/api-client generate

      # 【这个 job 的全部价值就在这一条】改了 contracts/openapi.yaml 但忘了
      # 重新生成，Go 和 TS 两端会继续用旧类型编译通过——错误只在运行时以
      # "字段不存在"的形式出现。这里把它变成一次红色的 CI。
      #
      # 【生成物为什么必须提交进 git】不提交的话每次构建都要先装两个生成器
      # 再跑一遍，且生成器的版本会漂移；提交之后两端类型是同一个快照。
      - name: Fail if generated files are stale
        run: |
          git diff --exit-code -- apps/api/internal/api/generated.go packages/api-client/src/schema.d.ts

  # ── 3. 契约本身写得对不对（spectral lint，issue #68）────────────
  #
  # 【为什么单独一个 job，而不是并进上面的 contract job】
  # 两个 job 回答的是两个问题，混在一起会让失败信息变成"契约相关的某一步红了"：
  #   · contract job："改了契约有没有重新生成"——它对着契约内容本身无感，
  #     一份写错但生成物同步的契约能全绿通过；
  #   · 这个 job："这份契约本身写得对不对"——枚举重项、$ref 旁边挂兄弟键、
  #     example 与 schema 对不上、参数漏了 description，都归它。
  # 和 ci.yml 顶部那条"六个 job 查六件不相干的事"是同一个理由。
  #
  # 【规则集与豁免全在 .spectral.yaml，一条都不在这里】改门禁只改那个文件；
  # 每一条豁免旁边都写着理由，以及"什么时候该回来重开它"。
  spec:
    name: Spec (spectral lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 【不装 Go、不装 pnpm】这个 job 只读 contracts/openapi.yaml 和
      # .spectral.yaml 两个文件，spectral 是个纯 Node 工具。
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 【为什么直接写 npx 而不用 make lint-spec】
      # 两个命令逐字一致（含 --fail-severity=warn），版本号在 env.SPECTRAL_VERSION。
      # 不用 make 的理由和 contract job 里那条一样、但更强：Makefile 开头会跑
      # `go env GOPATH` 拼 PATH，而这个 job 刻意不装 Go——那行会往日志里留一句
      # "go: command not found"，看起来像失败。
      #
      # 【--fail-severity=warn 不能省】oas 规则集的检查绝大多数是 warning，
      # spectral 默认只在 error 上返回非零；不提这一档，这个 job 会对所有
      # 真正有价值的问题保持绿色。
      - name: Lint contract with spectral
        run: npx --yes --no-fund --no-audit @stoplight/spectral-cli@${{ env.SPECTRAL_VERSION }} lint contracts/openapi.yaml --ruleset .spectral.yaml --fail-severity=warn

  # ── 4. 前端构建 + 交付期构建（go:embed 真的能嵌进产物） ──────────
  web:
    name: Web (lint / build / embed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter web lint

      # 【测试也要跑】lint 和 build 都不执行断言：oxlint 只看规则，tsc 只看类型，
      # 两者对"发送失败时消息会不会从界面消失"这类行为一无所知。之前这个 job
      # 只有 lint + build，于是 web/src 下那几个 vitest 用例在 CI 上从来没跑过——
      # 等于前端这块 diff 完全没有自动化门禁。
      - name: Test
        run: pnpm --filter web test

      # 【为什么只有这一条 eval 相关的门禁】完整的 eval 要打真实的 embedding /
      # chat API：花钱、依赖网络，而且回答生成没有固定 temperature 所以结果随机
      # ——放进 push 触发的 CI 会得到一条随机翻红的流水线，那比没有门禁更糟
      # （它会训练人忽略红色）。这里跑的只有指标数学与 SSE 帧解析的纯函数单测：
      # 不需要任何外部服务，却覆盖了最容易写错又最难发现的那部分（分母取错、
      # 名次算错、空 citation 时除零）。
      #
      # 【必须显式列文件，不能用目录】node 22 把 --test 后面的位置参数当 glob
      # 处理，`evals/lib` 匹配到的是那个目录本身，运行时报
      # ERR_TEST_FAILURE / # pass 0。引号不能省，否则 shell 会自己展开。
      - name: Eval metric self-test
        run: node --test "evals/lib/*.test.mjs"

      # 【交付脚本也有门禁了（issue #104）】scripts/upgrade.mjs 与 rollback.mjs
      # 是全仓唯一会真的动用户环境的代码（rollback 会 DROP DATABASE + 删 /data），
      # 在那之前没有任何自动化跑过它们——回归只能在"用户升级失败"时才被发现。
      # 这里跑的是 delivery-lib 的纯函数单测，加上 upgrade / rollback / release
      # 三个脚本的参数面与 --dry-run 分支：只用 Node 标准库，不碰数据库、镜像和
      # 网络，所以同样够格进 push 触发的 CI。
      #
      # 【为什么也要显式给 glob】理由与上面那条逐字相同（node 22 把 --test 后面的
      # 位置参数当 glob；引号不能省，否则 shell 会自己展开）。
      - name: Delivery script self-test
        run: node --test "scripts/*.test.mjs"

      # measure_recall.test.sh 用假 docker / 假 curl 造出"空库 / 查询失败 / 有数据"
      # 三条分支，验的是那个脚本的管道与退出码——真跑它要一个迁好的 Postgres 加一个
      # 真的 embedding API，那种回归没人会跑。也是完全离线的。
      - name: Recall metric harness self-test
        run: bash evals/measure_recall.test.sh

      # tsc -b && vite build。类型错误在这里暴露——vite 本身不做类型检查。
      - name: Build web
        run: pnpm --filter web build

      # 【为什么这里还要再 build 一次 Go】前面 go job 里的 go build 嵌的是
      # 一个只有 .gitkeep 的空目录，MountSPA 启动时只会打一条警告。
      # 这一条嵌的是真实产物，验证的是"交付期那条路径"：
      # make build（= build-web + build-go）能否产出带界面的二进制。
      - name: Build Go binary with embedded web assets
        run: go build ./...

  # ── 5. 需要真实 Postgres 的集成测试 ──────────────────────────────
  integration:
    name: Integration (real PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        # 【必须用 pgvector 镜像】migrations/0001 的第一句就是
        # CREATE EXTENSION IF NOT EXISTS vector，官方 postgres 镜像没有这个扩展。
        # 版本和 deployments/docker/docker-compose.yml 保持一致。
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: congorag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d congorag"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
          --health-start-period 5s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install migration CLIs
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@${{ env.MIGRATE_VERSION }}
          go install github.com/riverqueue/river/cmd/river@${{ env.RIVER_CLI_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # 【两套迁移都要跑】业务表由 golang-migrate 管，River 自己的队列表由
      # river CLI 管，谁也不知道对方存在（见 Makefile 的注释）。
      # 集成测试里 scheduler 那条需要 River 的表，少跑一套它就会失败。
      - name: Migrate business tables
        run: migrate -path migrations -database "$DB_URL" up

      - name: Migrate River queue tables
        run: river migrate-up --database-url "$DB_URL" --line main

      # 【门控变量名】测试里读的是 CONGORAG_TEST_DB_URL（不是 CONGORAG_DB_URL），
      # 没设就 t.Skip。这正是本地 `go test ./...` 不连库、CI 上会连库的原因。
      # 这一步会连真实的库跑，包括 internal/llm 那批会 ALTER 向量列类型的测试。
      # 容器是一次性的，所以它改坏 schema 也不影响任何人。
      - name: Go tests against real PostgreSQL
        env:
          CONGORAG_TEST_DB_URL: ${{ env.DB_URL }}
        run: go test -race ./...

      # ── 契约测试（issue #69）────────────────────────────────
      #
      # 【为什么在这个 job 里】它要两样东西：一份迁移好的 PostgreSQL（上面
      # 那些步骤刚准备好），以及一个能跑起来的 api。这个 job 是全仓唯一同时
      # 具备这两样的地方——放进 Go job 的话那边没有库，放进 web job 的话
      # 那边没有库也没有 Go。
      #
      # 【它和 contract job 查的不是一回事】那个 job 回答"改了契约有没有重新
      # 生成"，这个回答"运行时行为符不符合契约"（漏字段、状态码不对、错误
      # 形状走偏）。生成器对后面这三类完全无感。
      #
      # 【它不需要 Docker socket】测试库由 workflow 的 service container 提供
      # （下面那个 DB_URL），脚本只做一次 TCP 可达性探测。这也解释了为什么
      # 不是走 internal/testdb 那条 testcontainers 路径——这里已经有库了。
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Contract test (Prism proxy against the real api)
        env:
          CONGORAG_DB_URL: ${{ env.DB_URL }}
        run: node scripts/contract-test.mjs

  # ── 6. 交付形态：镜像能不能构建、compose 能不能解析、迁移入口能不能跑通 ──
  #
  # 【为什么需要这个 job】上面五个 job 一个都不碰 Docker。于是"改坏 Dockerfile /
  # 改坏 compose / 把 migrate-entrypoint.sh 里的 river 那行写错"这三类改动在 PR
  # 上是**全绿**的——唯一会红的地方是打 tag 时 release.yml 的 images job，而
  # migrate-entrypoint.sh 连那里都不跑（它只在用户解压启动包、真正升级时被执行）。
  # 缺陷的修复窗口因此被推迟到最坏的时刻：已经发出去之后。
  #
  # 【它和 release.yml 的 images job 查的不是一回事】那个 job 按架构构建
  # （arm64 要走 QEMU）、save 成 tarball、并且只 smoke test api 镜像——它是
  # 发布步骤。这个 job 在 runner 的原生架构上构建一次，查三件 PR 里就该知道的事：
  #   · 三个 target 拼得起来（尤其前端那句 `test -f apps/api/web/index.html`，
  #     它是"界面真的嵌进了二进制"的唯一守门人，位置在 go build 之前）；
  #   · 两份 compose 的语法与变量插值成立；
  #   · migrate 镜像对着一个真的 postgres **真的跑一次**，退出码 0。
  #
  # 【为什么这里不 smoke test api 镜像】api 启动时要预热 tiktoken 词表，那需要
  # 访问一次 openaipublic.blob.core.windows.net，失败即拒绝启动。把一条外网依赖
  # 放进每个 PR 的门禁，换来的是随机翻红——而随机翻红会训练人忽略红色（web job
  # 里那条"完整 eval 不进 CI"的注释是同一个理由）。镜像能不能构建在这查，能不能
  # 在目标架构上跑起来由 release.yml 在发布前查。
  docker:
    name: Docker (images / compose / migrate)
    runs-on: ubuntu-latest
    services:
      postgres:
        # 和 integration job 同一个镜像、同一个理由（migrations/0001 的第一句
        # 就是 CREATE EXTENSION IF NOT EXISTS vector）。下面 migrate 那一步要
        # 真的建表，所以这个服务是这个 job 的前提，不是可选项。
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: congorag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d congorag"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
          --health-start-period 5s
    steps:
      - uses: actions/checkout@v4

      # 【compose 校验排在构建前面】它几秒钟就出结果，失败信息也直接指向那个
      # 写错的文件；排在一趟几分钟的 docker build 后面只会让人多等。
      #
      # 【startup 那份必须显式给 CONGORAG_VERSION】它的镜像 tag 写成
      # `${CONGORAG_VERSION:?...}`，是刻意设成必填的：用户漏配 .env 时要在
      # `docker compose up` 那一刻就看到"变量没设"，而不是拿到一个指向
      # `congorag-api:` 的镜像名错误。这里显式给一个假版本号，让这条断言
      # 在 CI 上真的被执行一次——漏掉它就会在这里红。
      #
      # 【config -q 只做插值与语法检查】不拉镜像、不起容器，所以这一条
      # 不受网络与镜像仓库可用性的影响。
      - name: Validate both compose files
        run: |
          docker compose -f deployments/docker/docker-compose.yml config -q
          CONGORAG_VERSION=0.0.0 docker compose -f deployments/startup/docker-compose.yml config -q

      # 【三个 target 都构建，不是挑一个】它们共用前三层（前端构建、Go 编译、
      # CLI 工具），所以第一个真构建、后两个各只多一层 COPY——与 release.yml
      # 里那个 for 循环同一个理由。这里**不** save 成 tarball：那是发布形态的事。
      - name: Build the three delivery images
        run: |
          set -euo pipefail
          for t in api worker migrate; do
            docker build --target "$t" -t "congorag-${t}:ci" .
          done

      # 【这一步才是这个 job 的全部价值】migrate-entrypoint.sh 里那三行
      # （业务表迁移 + River 队列表迁移 + 输出收尾）是启动包里唯一"决定一次升级
      # 能不能成功"的可执行逻辑，而它在别的任何 job 里都不会被跑到。这里把它
      # 对着上面那个 postgres 真跑三次：
      #   ① 全新库：migrations/ 下全部业务表迁移与 River 的队列表都要真的建出来，
      #      退出码 0；
      #   ② 再跑一次：入口脚本的注释声明了两条命令都幂等（"no change"），
      #      所以这一步必须仍是 0——否则每次 `docker compose up` 都会红；
      #   ③ 不给 CONGORAG_DB_URL：必须非零，见下面那一步。
      #
      # 【--network host 是为了够到 service container】service container 的
      # 5432 发布在 runner 的宿主回环上，而 `docker run` 的容器默认有自己的
      # 网络命名空间，里面的 127.0.0.1 不是宿主。ubuntu runner 是 Linux，
      # 共享宿主网络命名空间是最确定的一条路（不用赌 host.docker.internal）。
      - name: Run the migrate image against a real PostgreSQL, twice (fresh + idempotent)
        run: |
          set -euo pipefail
          echo "· 第一次：全新库，两套迁移都要建出来"
          docker run --rm --network host -e CONGORAG_DB_URL="$DB_URL" congorag-migrate:ci
          echo "· 第二次：同一个库，两条命令都该报告无事可做并退出 0"
          docker run --rm --network host -e CONGORAG_DB_URL="$DB_URL" congorag-migrate:ci

      # 【反向断言】入口脚本开头那句 `:?` 是刻意的——compose 少传一个环境变量时，
      # 报错要指向"这个变量没设"，而不是 migrate 那条难以理解的驱动错误。
      # 光有正向的两次成功跑不出这个分支，而一个静默消失的保护比没有更糟，
      # 所以这里把"缺变量必须失败"也钉住。
      - name: Fail when CONGORAG_DB_URL is missing
        run: |
          if docker run --rm --network host congorag-migrate:ci; then
            echo "::error::没有 CONGORAG_DB_URL 时 migrate 容器退出了 0——入口脚本的 :? 断言没了"
            exit 1
          fi
          echo "缺 CONGORAG_DB_URL 时如预期非零退出"
