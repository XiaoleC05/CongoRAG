name: Release

# 打 tag 时构建产物并挂到对应的 Release 上（issue #72 / #73）。
#
# ══════════════════════════════════════════════════════════════════
# 【谁负责断言，谁负责构建——这一条是刻意划开的】
#
#   scripts/release.mjs   ← **断言**。它是人手里的那一个入口：
#                             CHANGELOG 有对应小节、契约 info.version 与版本号
#                             一致、工作区干净、在 main 上、tag 还不存在。
#                             断言全部发生在**推 tag 之前**——那是唯一能拦住
#                             一次错误发布的时刻。
#
#   这个工作流             ← **构建**。它一个断言都不做：不打 tag、不改文件、
#                             不碰仓库状态，只把产物建出来挂上去。
#
# 【为什么不把这个工作流也做成发布入口】它跑在 tag 已经推上去之后，
# 那时"版本号对不对""CHANGELOG 写没写"已经没有意义了——tag 已经在了。
# 让两处都做断言的结果是：两边迟早不一致，而人只会看那个绿的。
#
# 【为什么也不让 release.mjs 去等这个工作流】那样发布脚本就要轮询 Actions
# API、要处理"工作流排队""runner 挂了"这些和发布无关的状态。现在的分工是：
# release.mjs 推完 tag 就结束，产物由这个工作流异步补齐。两者唯一的耦合是
# 下面 publish job 里那个"等 Release 出现"的循环——方向是单向的。
# ══════════════════════════════════════════════════════════════════
on:
  push:
    tags: ['v*']
  # 【为什么还要留一个手动的入口】构建失败（网络、runner 抽风）时，
  # 重新推一次 tag 是唯一能把产物补出来的办法——而删 tag 再推会让
  # Release 与 tag 的关系变得可疑。用它重跑：tag 必须已经存在。
  workflow_dispatch:
    inputs:
      version:
        description: '要重建产物的版本（例如 3.0）。对应的 tag 必须已经存在。'
        required: true

# 上传 Release 附件要写权限。
permissions:
  contents: write

# 【不要 cancel-in-progress】CI 那边取消旧运行是对的（旧结果没意义），
# 但发布不是：取消一次跑到一半的构建会留下"半个 Release"。这里只串行化。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # 【版本全部锁死，理由与 ci.yml 顶部那段相同】构建产物要在用户的机器上
  # 跑起来，工具链的小版本漂移会让"同一份 tag 在不同时间构建出不同的二进制"。
  GO_VERSION_FILE: go.mod
  RIVER_CLI_VERSION: v0.47.0

jobs:
  # ── 1. 前端产物（整个发布只构建一次）─────────────────────────────
  #
  # 【为什么单独一个 job】静态资源与平台无关，而下面 binaries 是一个
  # 六条腿的 matrix。把 vite build 放进 matrix 里就是同样的活干六遍——
  # 那是几分钟乘以六。
  #
  # 【为什么必须先有它】apps/api/main.go 有 `//go:embed all:web`，api 的
  # 界面是**编译期**嵌进二进制的。少了这一步，go build 要么失败（目录不存在），
  # 要么产出一个"能跑但没有界面"的二进制——后者更危险，见下面那句断言。
  web-bundle:
    name: Web bundle (go:embed 的输入)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 这一步就是 ci.yml 的 web job 里那一条，逐字相同。
      # 它同时负责把 apps/api/web/.gitkeep 补回来（web/package.json 的
      # build 脚本里做了这件事）——vite 的 emptyOutDir 会连它一起擦掉。
      - name: Build web
        run: pnpm --filter web build

      # 【这一句和 Dockerfile 里那句是同一道断言，两个入口都要有】
      # `//go:embed all:web` 的 `all:` 前缀会把点开头的文件也匹配上，而
      # apps/api/web/.gitkeep 是 git 跟踪的——所以"目录里有东西"这件事
      # 是靠 .gitkeep 成立的。构建失败时会得到一个能编译、能启动、
      # 打开是空白页的 api。宁可在构建期红一次。
      - name: Assert the embedded assets are real
        run: |
          test -f apps/api/web/index.html || {
            echo "::error::apps/api/web/index.html 不存在——go:embed 会嵌进一个空目录，产物里的界面是空白的"
            exit 1
          }
          test -d apps/api/web/assets || {
            echo "::error::apps/api/web/assets 不存在——同上"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: apps/api/web
          # 【不能省】.gitkeep 是隐藏文件，v4 默认不打包隐藏文件。这里
          # 真正要的是 index.html 与 assets/，所以就算漏了它也不影响
          # 产物——但下面 binaries 会再去断言一次，两道保险各管一段。
          include-hidden-files: true
          retention-days: 7

  # ── 2. 六个平台的二进制 ─────────────────────────────────────────
  #
  # matrix 是 issue #72 要求的那六条腿：linux/darwin/windows × amd64/arm64。
  #
  # 【为什么六条腿都跑在 ubuntu 上，而不是各用各的原生 runner】这个项目
  # 的依赖全是纯 Go 的，CGO_ENABLED=0 之后交叉编译就是原生的——不需要
  # 目标平台的工具链，更不需要 macOS/windows runner（那两个的计费倍率
  # 分别是 10× 和 2×，而我们在这条流水线上**不跑测试**，只要产物）。
  # 要跑测试的话就得换回来：交叉编译出来的二进制不能在 runner 上执行。
  # 这是有意的取舍，写在这里，免得下次有人以为漏配了 runner。
  binaries:
    name: Binaries (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: web-bundle
    strategy:
      # 【一条腿失败不取消其它腿】六大平台里坏一个（比如某个 GOARCH 上
      # 某个依赖编不过）时，剩下的产物仍然有用——用户可能只关心自己那个平台。
      # 但整个 job 仍然是红的，不会让坏掉的产物被当成好的。
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: web-bundle
          path: apps/api/web

      # 【两道保险的第二道】上面 web-bundle 已经断言过一次，这里再断言
      # 一次是因为中间隔了一次 artifact 的打包与解包——那一步有自己的
      # 排除规则（隐藏文件、符号链接）。断言放在**真正要用它的地方**，
      # 失败信息才能指向真正的原因。
      - name: Assert the embedded assets arrived
        run: test -f apps/api/web/index.html || { echo "::error::下载下来的 web-bundle 里没有 index.html"; exit 1; }

      - name: Build api and worker
        shell: bash
        run: |
          set -euo pipefail
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          mkdir -p dist
          # -trimpath：产物里不含构建机的绝对路径，同一份 tag 在任何机器上
          # 构建出来的二进制是一样的。CI 产物要给用户，这一点尤其重要
          # （不然调试信息里会露出 runner 的目录结构）。
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w" -o "dist/congorag-api${EXT}" ./apps/api
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w" -o "dist/congorag-worker${EXT}" ./apps/worker
          cp LICENSE dist/
          ls -l dist

      # linux/darwin 给 tar.gz、windows 给 zip——两边的用户各自习惯哪个就给哪个。
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then V="${{ inputs.version }}"; fi
          NAME="congorag_${V}_${{ matrix.goos }}_${{ matrix.goarch }}"
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -r "../${NAME}.zip" .
          else
            tar czf "../${NAME}.tar.gz" .
          fi
          cd ..
          ls -l "${NAME}."*

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: congorag_*.*
          retention-days: 7

  # ── 3. 交付镜像（启动包用）──────────────────────────────────────
  #
  # 【为什么这里要按架构各构建一次，而不是交叉编译】镜像是 docker build
  # 出来的，Go 那层靠 TARGETARCH 自动交叉编译（见 Dockerfile），但镜像里
  # 还有 alpine 的 apk 包、node 的前端构建——那些必须原生跑。arm64 那条腿
  # 因此走 QEMU 模拟，会明显慢一些。
  #
  # 【为什么不推 registry 而是 docker save】issue #73 要求的就是 tarball：
  # 用户的启动包里带着镜像，`docker load` 一下就能用，不依赖任何 registry、
  # 也不需要账号。代价是包大一些，换来的是"离线可用"。
  images:
    name: Images (linux/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      # 【QEMU 只在 arm64 那条腿上是必需的】amd64 在 amd64 runner 上是原生的。
      # 仍然无条件装上：它便宜（几秒），而条件化会让"哪天 runner 架构变了"
      # 变成一次难查的失败。
      - uses: docker/setup-qemu-action@v3

      # buildx 让 --platform 生效。不做多平台单镜像，只是为了跨架构构建。
      - uses: docker/setup-buildx-action@v3

      - name: Compute version
        id: v
        run: |
          V="${GITHUB_REF_NAME#v}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then V="${{ inputs.version }}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # 三个 target 共用前三层（前端构建、Go 编译、CLI 工具），同一个
      # builder 的层缓存让它们只在第一次真正构建——不显式开 GHA 缓存是因为
      # 这里的复用发生在同一个 job 内，跨 job 缓存省下的那点时间不值得多一个
      # 会失效的配置项。
      - name: Build images
        run: |
          set -euo pipefail
          for t in api worker migrate; do
            docker build \
              --platform linux/${{ matrix.arch }} \
              --target "$t" \
              -t "congorag-${t}:${{ steps.v.outputs.version }}" \
              .
          done

      # 【镜像一个一个 save 还是三个一起 save】三个一起：docker save 接受
      # 多个 tag，而分层是共享的——分开 save 会把公共层各存一份。
      # 直接接 gzip 不落中间文件（那个 tar 有几百 MB）。
      - name: Save images to a tarball
        run: |
          set -euo pipefail
          V="${{ steps.v.outputs.version }}"
          docker save \
            "congorag-api:${V}" "congorag-worker:${V}" "congorag-migrate:${V}" \
            | gzip -6 > "congorag-images-linux-${{ matrix.arch }}.tar.gz"
          ls -lh "congorag-images-linux-${{ matrix.arch }}.tar.gz"

      # 【这一步查什么，不查什么】它**不**再验一次前端产物在不在——那是
      # Dockerfile 里 `RUN test -f apps/api/web/index.html` 的活，而且那一道
      # 在 go build 之前，位置更对。这里查的是另一件事：这个镜像里的二进制
      # 能不能在**目标架构**上真的跑起来。
      #
      # 为什么这件事需要单独查：arm64 那条腿是在 amd64 runner 上用 QEMU 模拟
      # 构建的，而"构建成功"不代表"跑得起来"——层缓存、binfmt、某个 apk 包
      # 装错架构，都会让一个跑不起来的镜像顺利构建完。等用户 docker load 之后
      # 才发现的话，那条报错（exec format error）和他做的事完全联系不上。
      #
      # /healthz 不碰数据库（它是存活探针，不是就绪探针），所以这里给一个
      # 连不上的 DB URL 也没关系——LoadConfig 只要求它非空。
      - name: Smoke-test the api image on the target architecture
        run: |
          set -euo pipefail
          V="${{ steps.v.outputs.version }}"
          docker run -d --name smoke --platform linux/${{ matrix.arch }} \
            -e CONGORAG_DB_URL='postgres://postgres:postgres@127.0.0.1:5432/congorag?sslmode=disable' \
            "congorag-api:${V}"
          for i in $(seq 1 20); do
            if docker exec smoke wget -qO- http://127.0.0.1:3210/healthz | grep -q '"status":"ok"'; then
              echo "linux/${{ matrix.arch }} 上的 api 起来了，/healthz 正常"
              docker rm -f smoke >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "::error::api 容器 20 秒内没有响应 /healthz"
          docker logs smoke || true
          docker rm -f smoke >/dev/null || true
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: images-linux-${{ matrix.arch }}
          path: congorag-images-linux-${{ matrix.arch }}.tar.gz
          retention-days: 7

  # ── 4. 启动包 ───────────────────────────────────────────────────
  startup-package:
    name: Startup package (linux/${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: images
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: images-linux-${{ matrix.arch }}
          path: incoming

      # 【这里只做装配，不构建镜像】镜像已经由上面的 matrix 建好了
      #（--images-archive 就是这个意思）。两条路走同一个装配逻辑，
      # 所以 CI 出来的包和本地 `node scripts/startup-package.mjs` 出来的
      # 结构完全一致——本地验过的包长什么样，用户拿到的就是什么样。
      - name: Assemble package
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then V="${{ inputs.version }}"; fi
          node scripts/startup-package.mjs \
            --version "$V" \
            --arch ${{ matrix.arch }} \
            --images-archive incoming/congorag-images-linux-${{ matrix.arch }}.tar.gz \
            --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: startup-package-linux-${{ matrix.arch }}
          path: dist/congorag-startup-*.zip
          retention-days: 7

  # ── 5. 挂到 Release 上 ─────────────────────────────────────────
  #
  # 【为什么要"等"】release.mjs 先推 tag、再建 Release（见那个脚本的注释：
  # 那两件事都可能失败，而幂等让重跑能补齐）。tag 推上去的那一刻这个工作流
  # 就被触发了，而 Release 对象可能几秒之后才被创建。构建要几分钟，
  # 所以正常情况下等不到——但"正常情况下不会发生"和"不会发生"是两回事，
  # 这个循环就是那几秒的保险。超时之后放弃并报错，不静默地少传文件。
  publish:
    name: Publish assets
    runs-on: ubuntu-latest
    needs: [binaries, startup-package]
    steps:
      # 【没有 checkout】这个 job 不读仓库里的任何文件，只处理上游的
      # artifact 和 Release 对象。`gh --repo` 自带仓库坐标，不需要工作区。
      - name: Compute version
        id: v
        run: |
          V="${GITHUB_REF_NAME#v}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then V="${{ inputs.version }}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: incoming
          merge-multiple: true

      - name: Collect assets
        run: |
          set -euo pipefail
          mkdir -p assets
          find incoming -type f \( -name 'congorag_*' -o -name 'congorag-startup-*.zip' \) -exec cp {} assets/ \;
          ls -lh assets

      - name: Wait for the Release to exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ steps.v.outputs.version }}"
          for i in $(seq 1 30); do
            if gh release view "v${V}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release v${V} 已经在了"
              exit 0
            fi
            echo "第 $i 次：Release v${V} 还没出现，5 秒后重试"
            sleep 5
          done
          echo "::error::等了两分半，Release v${V} 还是没出现。tag 推上去了但没有 Release 对象——用 scripts/release.mjs 补建之后重跑这个 job。"
          exit 1

      # 【为什么这里可以用 gh】本机开发环境没有装 gh（那是 scripts/release.mjs
      # 不依赖它的原因），但 GitHub 托管的 runner 预装了它——而这一步是
      # "把文件挂到 Release 上"，用 curl 手写 multipart 上传只会多出一段
      # 没人愿意维护的代码。
      #
      # --clobber：重跑时覆盖同名附件。这样"构建失败后重跑"是幂等的，
      # 不需要先手工删掉半截产物。
      - name: Upload assets to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "v${{ steps.v.outputs.version }}" assets/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release view "v${{ steps.v.outputs.version }}" --repo "$GITHUB_REPOSITORY"
