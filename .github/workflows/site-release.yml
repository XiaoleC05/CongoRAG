name: Site Release

# 站点发布产物。服务器只下载，不在服务器上编译。
on:
  push:
    tags: ['site-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, for example site-v2026.10.20'
        required: true

permissions:
  contents: write

concurrency:
  group: site-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build site
        working-directory: site
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          tar -czf ../site.tar.gz -C dist .

      - name: Checksums
        run: |
          sha256sum site.tar.gz > SHA256SUMS
          cp ops/deploy-site.sh deploy-site.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" site.tar.gz SHA256SUMS deploy-site.sh --clobber
          else
            gh release create "$TAG" site.tar.gz SHA256SUMS deploy-site.sh \
              --title "Site $TAG" \
              --notes "Static site. Deploy with ops/deploy-site.sh."
          fi
