openapi: 3.0.4

info:
  title: ConGoRAG API
  # 契约版本跟产品版本走，由发布脚本在发布前断言它与 tag 一致（ADR-002）。
  #
  # 【兼容性承诺的边界是路径里的 /api/v1，不是这个号】它标记的是"这份契约
  # 属于哪一个产品版本"，不是稳定性保证——读者不要把它当兼容性承诺读。
  #
  # 【必须加引号】不加的话 YAML 会把 2.0 解析成浮点数，而 info.version 的
  # 类型是 string——校验会报 "Incorrect type. Expected string"。
  version: "5.0.2"
  description: |
    依靠上下文提供 RAG 服务的全栈开源工具

    这份文件是唯一真相：Go 的接口和 TS 的类型都从它生成，
    两边不会对不上。改接口先改这里，再跑 make generate。

servers:
  - url: http://localhost:3210
    description: 本地开发

# ══════════════════════════════════════════════════════════════
# paths —— 有哪些 URL，每个支持什么方法
#
# operationId 用来当生成出来的函数名，要有业务含义且全局唯一。
# 状态码必须加引号：'200' 是字符串，200 会被解析成数字。
# ══════════════════════════════════════════════════════════════
paths:

  # ── 存活检查 ────────────────────────────────────────────────
  /healthz:
    get:
      operationId: healthz
      summary: 存活探针
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  # ── 就绪检查 ────────────────────────────────────────────────
  #
  # 【为什么和 /healthz 分成两个端点】两个问题、两个消费者、两个结论：
  # 存活探针回答"要不要重启我"，就绪探针回答"要不要给我发流量"。合成一个
  # 会让编排器在数据库抖动时反复重启实例——那是把一次网络抖动升级成一次
  # 停机（见 internal/api/server.go 里 Healthz 的注释）。
  #
  # 响应体的形状和 /healthz 保持一致，一个 curl / 一个解析器通吃。
  /readyz:
    get:
      operationId: readyz
      summary: 就绪探针（探测数据库）
      responses:
        '200':
          description: 依赖可用，可以接收流量
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # ── 知识库：列表 + 新建 ─────────────────────────────────────
  /api/v1/knowledge-bases:

    get:
      operationId: listKnowledgeBases
      summary: 列出全部知识库（按创建时间倒序）
      responses:
        '200':
          description: 知识库列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeBase'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      operationId: createKnowledgeBase
      summary: 新建一个知识库
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKnowledgeBaseRequest'
      responses:
        # 201 = 创建成功。创建类操作用 201 而不是 200。
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBase'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── 知识库：单个 ────────────────────────────────────────────
  /api/v1/knowledge-bases/{id}:

    # 路径参数写在路径这一级，三个方法共用：
    # 写在这里等于给下面三个方法都加上了这个参数，不用各写一遍。
    parameters:
      - name: id
        in: path
        required: true          # 路径参数必须是 true
        schema:
          type: string
          format: uuid

    get:
      operationId: getKnowledgeBase
      summary: 取一个知识库
      responses:
        '200':
          description: 找到了
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBase'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      operationId: renameKnowledgeBase
      summary: 改知识库的名字
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameKnowledgeBaseRequest'
      responses:
        # 204 = 成功但没有返回内容。
        #
        # 不用 200 + 返回改好的对象，是因为：
        # 那需要 usecase 的 Rename 之后再查一次库，多一次往返。
        # 而客户端本来就知道新名字（是它自己传上来的），不需要服务端再告诉它一遍。
        #
        # 如果你的前端希望直接拿到最新对象（比如要更新缓存里的 updatedAt），
        # 改成 200 + KnowledgeBase，handler 里 Rename 完再 Get 一次即可。
        '204':
          description: 改好了，无返回内容
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      operationId: deleteKnowledgeBase
      summary: 删除知识库（连带它的文档和分块）
      responses:
        '204':
          description: 删掉了，无返回内容
        '500':
          $ref: '#/components/responses/InternalError'

  # ── 文档：某个知识库下的列表 + 上传 ──────────────────────────
  /api/v1/knowledge-bases/{id}/documents:

    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: listDocuments
      summary: 列出这个知识库下的文档（按创建时间倒序，keyset 分页）
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 一页文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPage'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      operationId: uploadDocument
      summary: 上传一个文档（异步处理：落盘 + 入队，立即返回）
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        # 202 = 已接受，但处理还没完成——文档此刻是 queued 状态，
        # 真正的 parse/chunk/embed/index 由 worker 异步做。
        # 不是 201：201 暗示"资源已经完整创建好了"，这里只是排上了队。
        '202':
          description: 已接收，进入处理队列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        # 目标知识库不存在时，documents.knowledge_base_id 的外键插入会失败，
        # 错误管线的 classify 把外键违规和"查不到"一起映射成 404
        # （apps/api/internal/api/problem.go）。不声明的话这个状态码就是契约外的。
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── 知识库：整库重新索引 ────────────────────────────────────
  #
  # 粒度与单文档那条的区别只在范围：一个库里的全部文档一起重排。
  # 判断该用哪一条的判据是「影响面」——换 embedding 模型影响全库（走
  # createProvider 那条路，服务端自己决定要重建多少），而"这个库的向量
  # 看着不对"是局部怀疑，用这一条。
  /api/v1/knowledge-bases/{id}/reindex:

    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      operationId: reindexKnowledgeBase
      summary: 重新索引一个知识库下的全部文档
      responses:
        '202':
          description: 已排入处理队列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReindexAccepted'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── 检索调试（Hit Testing，issue #77）─────────────────────────
  #
  # 【为什么需要它】这是 RAG 项目里唯一能直接看见检索质量的地方：用户能
  # 看到的通常只有最终答案和 citation 徽标，"为什么这个问题答错了"完全
  # 无法自查——是没检索到、排序不对，还是检索对了而生成跑偏。离线 eval
  # 是批量测量，这个是单次在线探查，两者测的层次不同。
  #
  # 【按知识库限定范围】与 POST /knowledge-bases/{id}/reindex 同一条既有
  # 语义：请求路径里的 id 就是检索范围，不会跨知识库命中。
  /api/v1/knowledge-bases/{id}/search:

    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      operationId: searchKnowledgeBase
      summary: 在指定知识库里做一次向量检索，返回命中的分块与相似度
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeSearchRequest'
      responses:
        '200':
          description: 命中的分块，按相似度从高到低
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSearchResult'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '404':
          $ref: '#/components/responses/NotFound'
        # 检索要先把 query 变成向量，而这一步模型侧会失败（Key 不对、
        # 配额用完、网络不通）——那和聊天路径上的上游故障是同一类，
        # 502 而不是 500：错的不是我们，排查方向也不同。
        '502':
          description: 上游模型服务出错
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── 文档：单个 ──────────────────────────────────────────────
  /api/v1/documents/{id}:

    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: getDocument
      summary: 查一份文档的当前状态（前端拿它做处理中的轮询）
      responses:
        '200':
          description: 找到了
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      operationId: deleteDocument
      summary: 删除一份文档（连带它的分块；磁盘文件异步清理）
      responses:
        '204':
          description: 删掉了，无返回内容
        # 文档不存在（已被删、或 id 从来不存在）→ platform.ErrNotFound → 404。
        # 和上面的 getDocument 走同一套错误管线。
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── 重新索引（issue #39）────────────────────────────────────
  #
  # 【为什么需要它】换 embedding 模型会把旧向量清空，那些文档因此检索不到，
  # 必须重新切分/向量化/入库。同理，某一次文档处理中途失败、或者上传上限
  # 与任务超时（32 MiB / 30 分钟）卡住了一份大文档，也需要只重跑那一份。
  #
  # 【为什么要重建整库而不是只重建丢失的】清空发生在换模型那一刻，之后
  # 哪一份缺向量是可以查出来的——但"只补缺的"会让库里的向量来自两个不同
  # 时间点，而模型的向量空间只对同一批数据稳定。全量重建是唯一能保证
  # 检索结果一致的选项，代价由用户确认（见 createProvider 的 409）。
  /api/v1/documents/{id}/reindex:

    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      operationId: reindexDocument
      summary: 重新索引一份文档（重新切分、向量化、入库）
      responses:
        # 202：和上传一样，只是"排上了队"——真正干活的是 worker，
        # 文档此刻是 queued 状态，前端已有的轮询会自然跟上。
        '202':
          description: 已排入处理队列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          $ref: '#/components/responses/NotFound'
        # 【409 只在文档已经"排队中"时出现】判据是 MarkForReindex 的
        # `WHERE status IN ('ready','failed','processing')`：ready / failed /
        # processing 三种都接受（processing 的那份会被重排一遍），只有
        # queued 会 0 行命中 → 409。用户才知道"这次没排新的"。
        # 404 只在 id 根本不存在、或者文档被并发删掉时出现。
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── 会话 ────────────────────────────────────────────────────
  /api/v1/conversations:

    get:
      operationId: listConversations
      summary: |
        列出会话（keyset 分页），按**最近活动时间**倒序。

        【为什么排序键不是 createdAt】这个列表的用处是"回到刚才那个会话"，
        而一个三天前建的会话可能刚刚才被用过。按创建时间排会让它沉到列表
        底部，用户每次都得往下翻——列表的意义正好没了。

        【形状与另外三个列表一致】items + nextCursor，不是裸数组
        （v3.0 把三个列表端点统一成了这个形状，新端点跟着走，
        否则会出现两种列表形状并存）。
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 一页会话（按最近活动时间倒序）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationPage'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      operationId: createConversation
      summary: 新建一个会话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        # knowledgeBaseId 指向的知识库不存在 → conversations 的外键插入失败 → 404。
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/conversations/{id}:

    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    delete:
      operationId: deleteConversation
      summary: 删除一个会话（连带它的消息、事件与摘要）
      description: |
        级联硬删：消息、SSE 事件、计数器、摘要都跟着走。这与删除知识库的
        做法一致——方案定的是级联硬删，不留软删状态（软删会让"删了还在
        被检索到"这种事发生）。

        删掉之后这条会话的消息再也拉不回来，**包括其中的回答与引用**。
      responses:
        '204':
          description: 删掉了
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/conversations/{id}/messages:

    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: listConversationMessages
      summary: 列出一个会话的消息（按 sequence_no 升序，keyset 分页，第一页给最新的）
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 一页消息（升序）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      operationId: sendMessage
      summary: |
        发一条消息，响应是 SSE 流（text/event-stream），不是普通 JSON。
        帧格式和事件类型见 docs/sse-protocol.md，那份文档是唯一权威来源，
        这里的 schema 只是占位（OpenAPI 对流式响应体的描述能力有限）。

        带 Idempotency-Key 重复提交时不会重新生成：服务端把那一轮已经
        产生的事件补发一遍（同样的 event 类型、同样的真实 event_id），
        所以客户端不需要为「重发」写第二套解析逻辑。

        补发的作用域是「同一个会话 + 同一个键」。键保留 24 小时，过期之后
        同一个键可以重新执行。
      parameters:
        # 契约里第一个 in: header 参数。生成的 Go 签名会因此从
        # (c, id) 变成 (c, id, params)，handler 里取 params.IdempotencyKey。
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            客户端生成的去重键。同一个会话里带同一个键重复提交时，
            服务端不重新执行生成，而是把该轮已记录的事件补发出来，
            并以该轮的 done / error 帧收尾。

            省略这个头时行为与没有幂等能力时完全一样（每次都重新生成）。
            同一个键配不同的正文会返回 invalid_argument 的错误帧，
            而不是把上一轮的回答重放一遍。
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '200':
          description: SSE 流开始。之后的成功/失败都通过流内事件表达
            （token/citation/error/done），不再改变这个 200。
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/conversations/{id}/events:

    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: subscribeConversationEvents
      summary: 断线续传入口（SSE），docs/sse-protocol.md「断线续传」一节
      parameters:
        - name: after_event_id
          in: query
          required: false
          description: 只返回这个 id 之后的事件；省略或传 0 表示从头开始
          schema:
            type: integer
            format: int64
            default: 0
      responses:
        '200':
          description: |
            SSE 流。把 event_id > after_event_id 的事件补发一遍，然后结束响应。
            【它不持有连接等新事件】——那条承诺从来没有被实现，本地单机场景
            下也没有意义。要看某一轮后续的内容用 POST messages 的幂等键补发
            （见 docs/sse-protocol.md「幂等与断线的闭环」）。
          content:
            text/event-stream:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalError'

  # ── BYOK：模型接入配置 ─────────────────────────────────────
  #
  # 一次 POST 做完引导页"保存并开始"那一刻的全部事情：
  # 存 provider（Key 加密落盘）→ 存 chat 模型 → 探测 embedding 维度 →
  # 存 embedding 模型 → ALTER 向量列为 halfvec(N) → 建 HNSW 索引。
  # 开发文档 §4.4 有完整流程说明。
  /api/v1/providers:

    get:
      operationId: listProviders
      summary: 列出已配置的模型接入（Key 不会出现在响应里）
      responses:
        '200':
          description: Provider 列表，每个带它挂着的模型
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderWithModels'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      operationId: createProvider
      summary: 保存一个模型接入配置（引导页"保存并开始"）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProviderRequest'
      responses:
        '201':
          description: 探测成功，三行已落库，向量列已建好
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderWithModels'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '409':
          $ref: '#/components/responses/EmbeddingChangeRequiresReindex'
        '502':
          description: 上游模型服务出错（Base URL / Key / 模型名有问题，或探测请求失败）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Token 用量（issue #47）─────────────────────────────────
  #
  # 【为什么只做按模型聚合】按会话聚合要 JOIN messages，而只有聊天主路径
  # 会填 message_id（摘要压缩、记忆抽取、文档索引都说明不了归属，留着
  # NULL）——按会话加起来会天然少于总量，那个不一致几乎必然被用户发现。
  # 先把这个限制摆在明面上，等真要做的时候再决定 NULL 行怎么归属。
  #
  # 不做前端页面：那属于后续工作，这里只保证"能答出我用了多少"。
  # ── 模型条目：编辑与删除（issue #83）──────────────────────────
  #
  # 【为什么是 /models/{id} 而不是嵌在 provider 下面】模型的 id 是全局唯一的
  # （llm_models 的主键），而"它属于哪个 provider"这件事是配置的一部分、
  # 不是路径的一部分——把 provider 编进路径会多出一个"移动模型到另一个
  # provider"的语义，而那个动作没有意义（模型名只在它自己的接入点下有效）。
  /api/v1/models/{id}:

    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    patch:
      operationId: updateModel
      summary: 改一个模型条目的配置
      description: |
        能改的是：模型名、capabilities、上下文窗口、最大输出、tokenizer 类型。

        **`kind` 与 provider 改不了**：前者的语义是"这个模型是干什么用的"，
        改它等于换了一个模型（应该新建一条）；后者会让"这个模型名在哪家
        接入点下有效"这件事无从判断。

        **embedding 模型的模型名也改不了**：向量列的维度是在引导时按那个
        模型探测出来并 `ALTER` 到表上的（见 ADR-004），改名字会让"列里这些
        向量是谁算的"和配置对不上。要换 embedding 模型，走引导页那条会
        清空重建的流程。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateModelRequest'
      responses:
        '200':
          description: 改好之后的模型条目
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelSummary'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      operationId: deleteModel
      summary: 删掉一个模型条目
      description: |
        **当前生效的那个模型删不掉**（409 conflict）：当前生效模型由
        `LatestByKind` 按创建时间决定，删掉它会让发消息或检索立刻失败，
        而且失败点离用户的操作很远。要换模型，先把新的那条建出来。

        ⚠️ **它的 token 用量记录会跟着一起删掉。** `token_usage.model_id`
        的外键是 `ON DELETE CASCADE`（migrations/0003），所以这条模型的
        历史用量（`GET /api/v1/usage` 里那些数字）一并消失。**这是既有的
        表结构决定的，不是这次新引入的行为**——前端在确认框里要写明这一点。
      responses:
        '204':
          description: 删掉了
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/usage:

    get:
      operationId: getUsageSummary
      summary: 按模型聚合的 token 用量
      parameters:
        - name: since
          in: query
          required: false
          description: 起始时间（含）。RFC3339 格式。省略表示不限。
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          required: false
          description: 结束时间（不含）。RFC3339 格式。省略表示不限。
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 用量汇总
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageSummary'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── M4-A：Agent ────────────────────────────────────────────
  /api/v1/tools:

    get:
      operationId: listToolCatalog
      summary: 列出可用工具目录（创建 Agent 表单的勾选列表用）
      responses:
        '200':
          description: 工具目录
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ToolCatalogEntry'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/agents:

    get:
      operationId: listAgents
      summary: 列出已创建的 Agent
      responses:
        '200':
          description: Agent 列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Agent'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      operationId: createAgent
      summary: 创建一个 Agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/agents/{id}:

    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: getAgent
      summary: 查一个 Agent 的配置
      responses:
        '200':
          description: Agent 详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      operationId: updateAgent
      summary: 改一个 Agent 的配置（名称 / 描述 / system prompt / 工具集）
      description: |
        **整体替换，不是字段级合并**：请求体里给的字段就是改完之后的值，
        没给的字段按"清空"处理（这与 PATCH 的一般约定不同，是有意的——
        `instruction` 与 `toolNames` 的语义是"这个 Agent 现在是什么"，
        留空本身就表示"没有"；字段级合并会让"想清空 system prompt"
        这件事表达不出来）。

        `toolNames` 非空时要过两道门：每个工具都必须在注册表里，
        且当前生效的 chat 模型必须声明了工具调用能力（与创建时同一套判据）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
      responses:
        '200':
          description: 改好之后的 Agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/agents/{id}/runs:

    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: listAgentRuns
      summary: 列出一个 Agent 的历史执行记录（按创建时间倒序，keyset 分页）
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 一页运行记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunPage'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      operationId: startAgentRun
      summary: |
        启动一次 Agent 执行，响应是 SSE 流（text/event-stream）——
        和 sendMessage 同一个模式,帧格式见 docs/sse-protocol.md。

        **流的首帧永远是 `run_started`**（data: {"runId": ...}），
        新建与命中幂等键重放两种情况都会发。取消、run 级重订阅、
        跳转到运行详情都要用这个 id，而此前五种事件里没有任何一种带它。

        带 Idempotency-Key 重复提交时不会重新执行：服务端把那条 run
        已记录的事件补发一遍（同样的 event 类型、同样的真实 event_id）。
        作用的范围是「同一个 Agent + 同一个键」，键保留 24 小时。
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            客户端生成的去重键。同一个 Agent 上带同一个键重复提交时，
            服务端不重新执行这次运行，而是把该 run 已记录的事件补发出来
            （首帧仍是 run_started，带的是原来那条 run 的 id）。

            省略这个头时行为与没有幂等能力时完全一样（每次都真正执行）。
            同一个键配不同的 input 会返回 invalid_argument 的错误帧，
            而不是把上一次运行的结果重放一遍。

            保留窗口与会话消息那条路径共用同一个值（24 小时，见
            docs/adr/008-idempotency-replay-window.md）。过期之后同一个键
            可以重新执行——这是有意的产品语义，不是缺陷。
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAgentRunRequest'
      responses:
        '200':
          description: SSE 流开始
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── run 维度：重订阅 / 取消 / 恢复 ─────────────────────────────
  #
  # 【为什么是 /runs/{runId}/... 而不是文档里写的 /agents/{id}/runs/{runId}/...】
  # runId 是全局唯一的，Agent id 在这个路径上是冗余的；而本契约里已经有一条
  # /api/v1/runs/{runId}/steps，把新端点放在同一个前缀下才是一致的形状。
  # （另有一条实际的理由：/agents/runs/{runId}/events 与 /agents/{id} 在同一层
  # 上混用静态段和路径参数，那个歧义没必要引入。）
  /api/v1/runs/{runId}/events:

    parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: subscribeRunEvents
      summary: |
        补发一条 run 已经记录的事件（run 维度的断线重订阅）。

        **补发完已有的历史就结束响应**，不持有连接等新事件——与会话维度那条
        GET /conversations/{id}/events 是同一条语义。要看后续内容就再连一次。

        `after_event_id` 省略时从 0 开始，也就是把这条 run 的事件从头补发
        一遍（run 的事件号从 1 开始，按 run 独立发号）。
      parameters:
        - name: after_event_id
          in: query
          required: false
          description: 只补发 event_id 严格大于它的那些事件。
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
      responses:
        '200':
          description: SSE 流（补发完即结束）
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/runs/{runId}/cancel:

    parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      operationId: cancelAgentRun
      summary: |
        取消一次在途的 Agent 运行。

        取消后 run 的状态是 `cancelled`（不是 `failed`）——两者对用户的含义
        完全不同：前者是他自己要求的，后者是出错了。已经跑到终态的 run
        不可取消（409 conflict），没跑完的那一步保持 `interrupted`
        （取消发生在 run 层，step 没有 cancelled 这一态）。

        响应里带的是**取消生效之后**的状态，不是取消前的快照。
      responses:
        '200':
          description: 取消后的运行记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '404':
          $ref: '#/components/responses/NotFound'
        # 已经结束的运行不可取消。
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/runs/{runId}/resume:

    parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      operationId: resumeAgentRun
      summary: |
        从断点恢复一次被中断的运行（第二步起）。响应是 SSE 流，
        首帧同样是 run_started。

        **先检查再开流**：所有拒绝理由都在这条请求变成流之前判掉，
        所以下面那三种 409 是正常的 Problem 响应，而不是流里的一帧——
        客户端能按 type 给出准确的下一步提示。

        拒绝的三种情况：
        - `conflict`：只有 interrupted 的 run 可以恢复（别的状态要么已经
          结束、要么正在跑）。
        - `state_schema_version_mismatch`：这条 run 的快照是旧版本的代码
          写的，结构已经不兼容——明确拒绝并提示重新发起，而不是硬解出
          一个半截状态。
        - `tool_effect_already_applied` / `replay_unsafe`：没跑完的那一步
          不允许被平台自动重放（副作用可能已经生效，或工具自己声明了
          不可重放）。方案 §8 的恢复边界明说了不保证这类工具被安全重放。
      responses:
        '200':
          description: SSE 流开始
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/runs/{runId}/steps:

    parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: listRunSteps
      summary: 列出一次执行的全部步骤（执行轨迹页用）
      responses:
        '200':
          description: Step 列表，按 seq 升序
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentRunStep'
        '500':
          $ref: '#/components/responses/InternalError'

# ══════════════════════════════════════════════════════════════
# components —— 可复用的东西，被上面的 $ref 引用
# ══════════════════════════════════════════════════════════════
components:

  # ── 数据长什么样 ────────────────────────────────────────────
  schemas:

    KnowledgeBase:
      type: object
      required: [id, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid        # 提示生成器：Go 用 uuid.UUID，TS 用 string
        name:
          type: string
          minLength: 1
          maxLength: 200      # 和 internal/knowledge/usecase.go 的 maxNameLen 保持一致
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ── 会话 ──────────────────────────────────────────────────

    Conversation:
      type: object
      required: [id, title, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        knowledgeBaseId:
          type: string
          format: uuid
          nullable: true
          description: |
            可选关联的知识库——关联了，发消息时会做检索增强；
            不关联就是一次不带 RAG 的纯对话。方案文档没有定义这个字段，
            是实现时补上的决策（见 internal/conversation/model.go 的注释）。
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateConversationRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
          example: 关于 ConGoRAG 的问答
        knowledgeBaseId:
          type: string
          format: uuid
          nullable: true

    SendMessageRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          # 和 internal/conversation/usecase.go 的 MaxTextLen 保持一致
          # （也是 internal/agent/usecase.go 的 maxInputLen 那个数字）：
          # 正文会原样进模型上下文，超长在这里就按 invalid_argument 拒掉，
          # 而不是等上游模型报错、被归到 upstream_llm_error（issue #109）。
          maxLength: 8000
          example: ConGoRAG 的默认端口是多少？

    Message:
      type: object
      required: [id, conversationId, role, content, status, sequenceNo, createdAt]
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          type: string
        status:
          type: string
          enum: [streaming, completed, failed]
        sequenceNo:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time

    # ── 文档 ──────────────────────────────────────────────────

    # ── 检索调试（Hit Testing）────────────────────────────────
    #
    # 请求体没有复用按知识库重建那条的语义：这里只需要一句 query。
    KnowledgeSearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 2000
          description: 要检索的文本。会先被当前生效的 embedding 模型变成向量。
        topK:
          type: integer
          nullable: true
          minimum: 1
          maximum: 50
          description: |
            最多返回多少个命中分块。省略时用 5。

            【越界返回 400，不静默夹取】夹取会让人以为"只命中这么多"，
            而实际是被服务端截断了——调试视图上这个区别很关键。
      example:
        query: ConGoRAG 的向量检索用的是什么类型？
        topK: 5

    # 命中分块。字段与 SSE 的 citation 事件逐个对应（chunkId/documentId/
    # filename/snippet/score），这样前端的引用卡片组件可以直接复用，
    # 不需要为调试视图再做一套展示。
    KnowledgeSearchHit:
      type: object
      required: [chunkId, documentId, filename, snippet, score]
      properties:
        chunkId:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        filename:
          type: string
          description: 这个分块来自哪份文档（检索 SQL 里 JOIN documents 拿到）
        snippet:
          type: string
          description: 分块正文
        score:
          type: number
          format: double
          description: 余弦相似度，越大越相关

    KnowledgeSearchResult:
      type: object
      required: [hits]
      properties:
        hits:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeSearchHit'
          description: |
            按相似度从高到低。可能是空数组（这个知识库没有任何向量，
            或者 query 与所有分块都不相关）——空数组与"检索失败"是两件事，
            前者前端应显示"没有命中"，后者是一个 4xx/5xx。

    Document:
      type: object
      required: [id, knowledgeBaseId, filename, status, byteSize, chunkCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        knowledgeBaseId:
          type: string
          format: uuid
        filename:
          type: string
          description: 用户上传时的原始文件名
        status:
          type: string
          enum: [queued, processing, ready, failed]
          description: |
            四态状态机（代码架构设计 §5.4）：queued → processing → ready，
            任意阶段失败进 failed，failed 只能退回 queued 重试。
        byteSize:
          type: integer
          format: int64
        chunkCount:
          type: integer
          format: int64
          description: |
            这份文档当前的向量分块数（issue #82）。

            【为什么它是"检索质量的第一个可观察量"】切分策略不合适时分块数
            会明显异常（一份 10 页的 PDF 切出 3 块、或者切出 8000 块）。
            它也是"文档到底处理完没有"的第二个信号：status 是 ready 但
            chunkCount 是 0，说明切分或向量化那一轮实际上什么都没产出。

            未处理完的文档是 0——不是 null。null 会让前端多写一条分支，
            而"还没有分块"和"没有这个字段"对用户是同一件事。
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # 整库重建的响应。只报"这次真的排进去多少份"——不报总量、不报进度，
    # 那些由前端轮询文档列表（受影响的行会显示为 queued）自己看。
    ReindexAccepted:
      type: object
      required: [enqueued]
      properties:
        enqueued:
          type: integer
          description: |
            本次真的排进队列的文档数。已经在排队或正在处理的文档不计入——
            它们本来就会被重新处理一遍。

    # ── 分页信封 ──────────────────────────────────────────────
    #
    # 三个会无界增长的列表用同一形状：items + nextCursor。
    # nextCursor 为 null 表示「到底了」——前端据此把「加载更多」按钮收起来，
    # 而不是让它一直亮着、点了没反应。

    DocumentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Document'
        nextCursor:
          type: string
          nullable: true
          description: 下一页的游标；null 表示没有更多了。

    AgentRunPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentRun'
        nextCursor:
          type: string
          nullable: true
          description: 下一页的游标；null 表示没有更多了。

    ConversationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Conversation'
        nextCursor:
          type: string
          nullable: true
          description: 下一页的游标；null 表示没有更多了。

    MessagePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        nextCursor:
          type: string
          nullable: true
          description: |
            下一页的游标；null 表示没有更早的消息了。

            **方向是「更旧」**：会话消息的第一页给的是**最新**的 N 条
            （按 sequence_no 升序返回），翻下一页拿的是更早的。聊天页
            打开就该看到最近发生的事，而不是一年前的那一句。

    # 请求体和响应体是两个 schema，不复用 KnowledgeBase：
    # 创建时客户端只该传 name——id 和两个时间戳由服务端生成。
    # 复用的话，生成的类型里会多出三个客户端不该填的字段。
    CreateKnowledgeBaseRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: 我的知识库

    RenameKnowledgeBaseRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: 新的名字

    # ── BYOK ──────────────────────────────────────────────────

    Capabilities:
      type: object
      description: |
        模型声明支持的能力，全部由用户手动勾选——OpenAI 兼容 API
        不保证能自动查询这些（技术方案 §五）。embedding 这一位不在这里：
        它由服务端根据这个模型是 chatModel 还是 embeddingModel 自动决定，
        不需要用户勾选。
      properties:
        chat:
          type: boolean
          default: true
        streaming:
          type: boolean
          default: false
        toolCalling:
          type: boolean
          # 【默认值是 true，而且这个默认值真的参与判断】引导页的「支持工具
          # 调用」复选框默认勾选，服务端的模型门控会读这一位（issue #38）。
          # 默认不勾等于默认禁掉所有带工具的 Agent——那是升级即坏。
          #
          # 注意 oapi-codegen 不会替服务端应用这里的 default，所以
          # apps/api/internal/api/server.go 的 fromAPICapabilities 里也显式
          # 补了一遍，两处必须一起改。
          default: true
        reasoning:
          type: boolean
          default: false

    ChatModelInput:
      type: object
      required: [modelId, contextWindow, maxOutputTokens, tokenizerType]
      properties:
        modelId:
          type: string
          minLength: 1
          maxLength: 200
          example: Qwen/Qwen2.5-7B-Instruct
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        contextWindow:
          type: integer
          minimum: 1
          example: 32000
        maxOutputTokens:
          type: integer
          minimum: 1
          example: 4096
        tokenizerType:
          type: string
          minLength: 1
          maxLength: 100
          example: cl100k_base

    CreateProviderRequest:
      type: object
      required: [baseUrl, apiKey, chatModel, embeddingModelId]
      properties:
        baseUrl:
          type: string
          minLength: 1
          maxLength: 500
          example: https://api.siliconflow.cn/v1
        apiKey:
          type: string
          minLength: 1
          maxLength: 500
          description: 落盘前用应用级主密钥加密，明文只在这一次请求体里出现
        chatModel:
          $ref: '#/components/schemas/ChatModelInput'
        embeddingModelId:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            只要模型名——维度不用填，服务端用这个字段连同 baseUrl/apiKey
            发一次真实的 embedding 请求探测出来。
          example: BAAI/bge-m3
        allowEmbeddingReset:
          type: boolean
          # 【注意：带 default 会被生成成非可选字段】本仓已记录的行为——
          # openapi-typescript 对有 default 的字段不会生成 `?`，所以前端
          # 必须总是显式传它。这是有意的：这个字段的语义不允许"没传"和
          # "传了 false"被混为一谈。
          default: false
          description: |
            用户已经确认"换 embedding 模型会清空已有向量、并自动重建"。

            默认 false：库里的向量不属于这个模型、或者改列类型会清空已有
            向量时，保存失败并返回 409 `embedding_change_requires_reindex`，
            不做任何修改。前端据此弹确认框，用户点了确认再带 true 重发一次。

            true：在同一个事务里清空这些向量、改列类型，并把全部文档重新
            排队重建；重建完成的文档数在响应的 requeuedDocuments 里。

    # 响应里的模型：比 ChatModelInput 多 id/kind/embeddingDim/createdAt，
    # 少不了（chat 模型的 embeddingDim 恒为 0，见 internal/llm/model.go）。
    ModelSummary:
      type: object
      required: [id, modelId, kind, capabilities, contextWindow, maxOutputTokens, tokenizerType, embeddingDim, createdAt]
      properties:
        id:
          type: string
          format: uuid
        modelId:
          type: string
        kind:
          type: string
          enum: [chat, embedding]
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        contextWindow:
          type: integer
        maxOutputTokens:
          type: integer
        tokenizerType:
          type: string
        embeddingDim:
          type: integer
          description: 只对 kind = embedding 有意义；chat 模型这一位恒为 0
        createdAt:
          type: string
          format: date-time

    ProviderWithModels:
      type: object
      required: [id, baseUrl, createdAt, models]
      properties:
        id:
          type: string
          format: uuid
        baseUrl:
          type: string
        createdAt:
          type: string
          format: date-time
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelSummary'
        # 【绝对不能给它写 default】本仓已记录的生成器行为：带 default 的
        # 可选字段会被 openapi-typescript 生成成必填，对现有 TS 客户端就是
        # 破坏性变更。不带 default 它才是 `requeuedDocuments?: number | null`。
        requeuedDocuments:
          type: integer
          nullable: true
          description: |
            这一次真的被重新排队的文档数。只有 POST /providers 在确实执行了
            重建时才是一个数字；GET /providers 恒为 null——它描述的是"这一次
            请求做了什么"，不是一个可以持久化的状态。

    # ── Token 用量 ────────────────────────────────────────────

    UsageSummary:
      type: object
      required: [totalPromptTokens, totalCompletionTokens, byModel]
      properties:
        totalPromptTokens:
          type: integer
          format: int64
        totalCompletionTokens:
          type: integer
          format: int64
        # 【绝不能是 null】没有用量时它是空数组，不是 null——前端拿到 null
        # 去做 .map() 会直接崩（和 toAPIKBList 那条是同一个约定）。
        byModel:
          type: array
          items:
            $ref: '#/components/schemas/UsageByModel'

    UsageByModel:
      type: object
      required: [providerId, modelId, modelName, kind, calls, promptTokens, completionTokens]
      properties:
        providerId:
          type: string
          format: uuid
        modelId:
          type: string
          format: uuid
          description: llm_models 的主键
        modelName:
          type: string
          description: |
            用户在引导页里敲的那个模型名（llm_models.model_id）。
            给用户看的是它，不是上面那个 uuid。
        kind:
          type: string
          enum: [chat, embedding]
        calls:
          type: integer
          format: int64
          description: |
            调用次数。**哪怕上游没回 usage 也会计一次**（那一行的 token 记 0）
            ——行数代表调用次数，是可观测事实。
        promptTokens:
          type: integer
          format: int64
        completionTokens:
          type: integer
          format: int64

    # ── Agent ─────────────────────────────────────────────────

    ToolCatalogEntry:
      type: object
      required: [name, description, sideEffectLevel]
      properties:
        name:
          type: string
        description:
          type: string
        sideEffectLevel:
          type: string
          enum: [READ_ONLY, WRITE_IDEMPOTENT, WRITE_NON_IDEMPOTENT]

    Agent:
      type: object
      required: [id, name, description, instruction, toolNames, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        instruction:
          type: string
          maxLength: 4000
          description: 系统提示词
        toolNames:
          type: array
          items:
            type: string
          description: 这个 Agent 被允许使用的工具名子集（见 ToolCatalogEntry.name）
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateAgentRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: 计算助手
        description:
          type: string
          maxLength: 2000
        instruction:
          type: string
          maxLength: 4000
          example: 你是一个帮助用户做算术和资料检索的助手。
        toolNames:
          type: array
          items:
            type: string
          example: [calculator]

    # 改一个 Agent。**required 里是全部可改字段**——见契约里那个 operation
    # 的 description：这是整体替换，没给的字段按"清空"处理。
    UpdateAgentRequest:
      type: object
      required: [name, description, instruction, toolNames]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        instruction:
          type: string
          maxLength: 4000
        toolNames:
          type: array
          items:
            type: string

    # 改一个模型条目。同样是整体替换。
    UpdateModelRequest:
      type: object
      required: [modelId, capabilities, contextWindow, maxOutputTokens, tokenizerType]
      properties:
        modelId:
          type: string
          minLength: 1
          description: |
            模型名（比如 `gpt-4o-mini`）。**embedding 模型不能改这一项**——
            见契约里 updateModel 的 description。
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        contextWindow:
          type: integer
          minimum: 1
        maxOutputTokens:
          type: integer
          minimum: 1
        tokenizerType:
          type: string
          description: tiktoken 的编码名（比如 `o200k_base`）。取值必须是已认识的类型。

    StartAgentRunRequest:
      type: object
      required: [input]
      properties:
        input:
          type: string
          minLength: 1
          # 和 internal/agent/usecase.go 的 maxInputLen 保持一致。
          # Agent 这条路径没有 ctxmgr 的 token 预算兜底，超长输入只能靠
          # 这里拒掉；否则上游报的错会被归到 upstream_llm_error，前端按
          # 那个 type 提示"检查 API Key 和配额"，排查方向从第一句话起
          # 就是错的（issue #34 那类误报，issue #109 说的是它换到了这条
          # 路径上）。
          maxLength: 8000
          example: 3 个 128 的和乘以 2 是多少？

    AgentRun:
      type: object
      required: [id, agentId, status, currentStep, input, output, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        agentId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled, interrupted]
        currentStep:
          type: integer
        input:
          type: string
        output:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AgentRunStep:
      type: object
      required: [id, runId, seq, type, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        seq:
          type: integer
        type:
          type: string
          enum: [llm, tool]
        status:
          type: string
          enum: [pending, running, completed, failed, interrupted]
        toolName:
          type: string
          nullable: true
        toolArgs:
          nullable: true
          description: 原始 JSON，形状由具体工具决定，前端不需要强类型解析
        toolResult:
          nullable: true
        latencyMs:
          type: integer
          nullable: true
        error:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    # 统一错误体，遵循 RFC 7807（application/problem+json）。
    # 前端按 type 字段分发处理，不看 description 文案。
    Problem:
      type: object
      required: [type, status]
      properties:
        type:
          type: string
          example: not_found
          description: 机器可读的错误类型，前端按它分支
        title:
          type: string
          example: 资源不存在
          description: 人类可读的简短说明
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: knowledge base 3f2b1c... not found
          description: 具体说明

  # ── 可复用的分页参数 ────────────────────────────────────────
  #
  # 【只给会无界增长的接口】判据是「这个集合是否随用户操作单调增长、
  # 且没有任何删除路径」。会话消息、知识库下的文档、Agent 运行历史三条
  # 都满足；知识库/Agent/工具目录/provider 都是手工创建的有限集合，
  # 运行步骤被 maxIterations 硬夹住，它们继续返回裸数组。
  #
  # 【响应是信封不是数组】客户端拿不到游标就没法翻页，而让客户端自己从
  # 最后一条算游标等于把 SQL 的排序键和编码格式泄漏进前端。
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: |
        一页最多返回多少条。省略时用 50；允许 1..200，越界返回 400
        （不静默夹取——那会让你以为拿满了，实际少了一半）。
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        上一页响应里 nextCursor 的值，用来取下一页。第一页省略它。

        **不透明**：不要解析它的内容、也不要自己构造。它的格式（目前是
        base64）随时可能变，按内容分支的客户端会在某次升级后静默拿到
        错的一页。解不出来时服务端返回 400。

        方向：nextCursor 的含义是「更旧的一页」（这三个列表都是按时间
        倒序、或按消息序号往回翻），不是「第 N+1 页」。
      schema:
        type: string
        maxLength: 200

  # ── 可复用的响应 ────────────────────────────────────────────
  responses:

    InvalidArgument:
      description: 参数不合法
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    # 409：请求本身合法，但和库里已有的状态冲突。来源有两处——
    # 重新索引一份已在排队/正在处理的文档，以及下面那条专门的
    # embedding_change_requires_reindex。detail 会写清楚冲突在哪。
    Conflict:
      description: 与已有状态冲突
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    # 换 embedding 模型时，库里的向量不属于新模型——检索只会认当前生效
    # 模型产生的向量，直接改配置会让那些分块一条都查不到（文档仍显示
    # ready、检索静默返回零条，见 internal/llm/postgres.go 的
    # alterVectorColumns）。
    #
    # 【为什么单独一条而不是复用 Conflict】前端要按 type 弹一个"会清空
    # 已有向量并自动重建，期间检索结果为空"的确认框，用户确认后带
    # allowEmbeddingReset 重发；一个笼统的 conflict 它分不出来。
    EmbeddingChangeRequiresReindex:
      description: |
        换 embedding 模型需要先确认清空并重建。
        type 是 embedding_change_requires_reindex，detail 里写明会丢掉
        多少行、以及怎么继续（带 allowEmbeddingReset 重发）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    NotFound:
      description: 资源不存在
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    InternalError:
      description: 服务内部错误
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    # 503：实例自身活着，但它依赖的东西现在用不了，不该给它发流量。
    #
    # 【为什么和 InternalError 分开】调用方对这两件事的处理完全不同：
    # 500 是"这个请求我们写错了"，503 是"过一会儿再来"。编排器也要据这个
    # 区别决定是重启实例还是把它摘出负载均衡。
    ServiceUnavailable:
      description: 依赖不可用
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
